<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed &amp; Fraction Explorer</title>
  <style>
    /* =====================================================================
       RESET & 16:9 CLASSROOM TV WHITEBOARD LOCK (ZERO SCROLL, NO DEPS)
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg: #ffffff;
      --dock-bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --ink: #0f172a;
      --ink-muted: #64748b;

      --blue: #2563eb;       /* Royal Blue: Multiply & km accents */
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;

      --teal: #059669;       /* Emerald/Teal: Divide & Solved (60 min / km/h) */
      --teal-soft: #ecfdf5;
      --teal-border: #a7f3d0;

      --amber: #d97706;      /* Amber: Subtle highlights & active progress */
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;

      --red: #dc2626;        /* Crimson: Incorrect answer feedback */
      --red-soft: #fef2f2;
      --red-border: #fecaca;

      /* Dynamic chain scale updated by JS based on number of steps */
      --chain-scale: 1;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 4-Band Vertical Grid: 8vh Top | 14vh Track | 54vh Stage | 24vh Dock = 100vh */
    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 8vh 14vh 54vh 24vh;
      background: var(--bg);
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================================
       BAND 1: SLIM TOP BAR (~8vh, pure white with subtle bottom border)
       ===================================================================== */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 2vw;
      background: var(--bg);
      border-bottom: 1.5px solid var(--border);
      gap: 1vw;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .topbar-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1vw;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.65vw;
    }

    .game-top-controls {
      display: inline-flex;
      align-items: center;
      gap: 0.65vw;
    }

    /* Segmented Mode Toggle: Explore | Game */
    .mode-pill {
      display: inline-flex;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 0.35vh;
      gap: 0.25vw;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-weight: 800;
      font-size: clamp(0.85rem, 1.25vw, 1.3rem);
      padding: 0.65vh 1.4vw;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .mode-btn.active {
      background: var(--ink);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
    }

    .mode-btn.active.game-on {
      background: var(--teal);
      color: #ffffff;
    }

    /* Game Center Controls: ★ 0 | 1 2 3 | Next → */
    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4vw;
      background: var(--amber-soft);
      border: 1.5px solid var(--amber-border);
      color: var(--amber);
      font-weight: 900;
      font-size: clamp(0.9rem, 1.35vw, 1.4rem);
      padding: 0.55vh 1vw;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .tier-dots {
      display: inline-flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 0.3vh;
      gap: 0.25vw;
    }

    .tier-dot {
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-weight: 900;
      font-size: clamp(0.82rem, 1.15vw, 1.2rem);
      width: clamp(28px, 2.3vw, 40px);
      height: clamp(26px, 3.8vh, 38px);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tier-dot.active {
      background: var(--amber);
      color: #ffffff;
    }

    .next-btn {
      border: 1.5px solid var(--border);
      background: var(--surface-subtle);
      color: var(--ink-muted);
      font-weight: 800;
      font-size: clamp(0.85rem, 1.25vw, 1.3rem);
      padding: 0.65vh 1.25vw;
      border-radius: 999px;
      cursor: not-allowed;
      opacity: 0.55;
      transition: all 0.2s ease;
    }

    .next-btn.ready {
      background: var(--teal);
      border-color: var(--teal);
      color: #ffffff;
      cursor: pointer;
      opacity: 1;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
      animation: nextPulse 1.6s ease-in-out infinite;
    }

    .next-btn.ready:hover {
      background: #047857;
    }

    @keyframes nextPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    /* Vehicle Picker & Icon-Only Undo / Reset */
    .vehicle-picker {
      display: inline-flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 0.3vh;
      gap: 0.2vw;
    }

    .veh-btn {
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--ink-muted);
      width: clamp(34px, 3vw, 50px);
      height: clamp(28px, 4.4vh, 42px);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .veh-btn:hover {
      color: var(--ink);
      background: rgba(15, 23, 42, 0.05);
    }

    .veh-btn.active {
      background: var(--bg);
      color: var(--blue);
      border-color: var(--blue-border);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.14);
    }

    .veh-btn svg {
      width: clamp(18px, 1.75vw, 28px);
      height: clamp(18px, 1.75vw, 28px);
    }

    .top-divider {
      width: 1.5px;
      height: 3.4vh;
      background: var(--border);
      margin: 0 0.2vw;
    }

    .icon-btn {
      width: clamp(34px, 3vw, 48px);
      height: clamp(30px, 4.8vh, 44px);
      border-radius: 0.7vw;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    }

    .icon-btn:hover:not(:disabled) {
      background: var(--surface-subtle);
      border-color: var(--border-strong);
    }

    .icon-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .icon-btn:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    .icon-btn svg {
      width: clamp(16px, 1.45vw, 24px);
      height: clamp(16px, 1.45vw, 24px);
    }

    /* =====================================================================
       BAND 2: ANIMATED VEHICLE TRACK BAND (~14vh, pure white)
       ===================================================================== */
    .track-band {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0.6vh 2.5vw 0.4vh 2.5vw;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* Road Lane */
    .road-stage {
      position: relative;
      width: 100%;
      height: 11.2vh;
      overflow: hidden;
      border-bottom: 2.5px solid var(--border-strong);
    }

    /* Subtle Horizontal Distance Dashes */
    .road-dashes {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1.4vh;
      height: 2px;
      background-image: repeating-linear-gradient(
        to right,
        #cbd5e1 0px,
        #cbd5e1 22px,
        transparent 22px,
        transparent 52px
      );
      opacity: 0.7;
    }

    /* Moving Vehicle Container (positioned via requestAnimationFrame) */
    .vehicle-runner {
      position: absolute;
      bottom: 0.7vh;
      left: 0;
      display: inline-flex;
      align-items: center;
      will-change: transform;
      pointer-events: none;
    }

    .vehicle-svg-wrap {
      height: 8.6vh;
      width: auto;
      display: flex;
      align-items: flex-end;
    }

    .vehicle-svg-wrap svg {
      height: 100%;
      width: auto;
      display: block;
      overflow: visible;
    }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheelSpin var(--wheel-dur, 0.8s) linear infinite;
    }

    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Speed Boost Lines behind Vehicle */
    .speed-lines {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.7vh;
      margin-right: 0.5vw;
      opacity: 0;
      transform: translateX(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .speed-lines.boost {
      opacity: 1;
      transform: translateX(0);
    }

    .s-line {
      height: 3px;
      border-radius: 999px;
      background: var(--teal);
    }

    .s-line:nth-child(1) { width: 32px; opacity: 0.9; }
    .s-line:nth-child(2) { width: 48px; opacity: 1; }
    .s-line:nth-child(3) { width: 24px; opacity: 0.75; }

    /* Slim Progress Bar at Bottom of Main Stage with 60 min Goal Marker */
    .progress-wrap {
      position: relative;
      width: 100%;
      padding-top: 0.8vh;
      height: 5.2vh;
      flex-shrink: 0;
    }

    .progress-track-outer {
      position: relative;
      width: 100%;
      height: 1.25vh;
      display: flex;
      align-items: center;
    }

    .progress-track {
      width: 100%;
      height: 1.1vh;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 30%;
      border-radius: 999px;
      background: var(--amber);
      transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease;
    }

    .progress-fill.solved {
      background: var(--teal);
    }

    .goal-line {
      position: absolute;
      top: -0.45vh;
      bottom: -0.45vh;
      width: 3px;
      background: var(--teal);
      border-radius: 999px;
      transform: translateX(-50%);
      transition: left 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .progress-tags {
      position: relative;
      width: 100%;
      height: 2.6vh;
      margin-top: 0.35vh;
    }

    .tag-60 {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: clamp(0.75rem, 1.1vw, 1.15rem);
      color: var(--teal);
      white-space: nowrap;
      transition: left 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tag-cur {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-weight: 800;
      font-size: clamp(0.72rem, 1.05vw, 1.08rem);
      color: var(--amber);
      white-space: nowrap;
      transition: left 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }

    /* =====================================================================
       BAND 3: MAIN FRACTION STAGE (~54vh, pure white whiteboard canvas)
       ===================================================================== */
    .stage {
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.4vh 2.5vw 0.8vh 2.5vw;
      overflow: hidden;
    }

    /* Game Mode Word Problem + Prominent ___ km/h Answer Bar */
    .game-prompt-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2vw;
      padding: 1.2vh 1.8vw;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 1.1vw;
      flex-shrink: 0;
    }

    .problem-text {
      font-size: clamp(1.15rem, 2.05vw, 2.25rem);
      font-weight: 800;
      line-height: 1.22;
      color: var(--ink);
      letter-spacing: -0.015em;
    }

    .answer-group {
      display: inline-flex;
      align-items: center;
      gap: 0.75vw;
      flex-shrink: 0;
    }

    .answer-box {
      display: inline-flex;
      align-items: baseline;
      gap: 0.45vw;
      background: var(--bg);
      border: 2.5px solid var(--border-strong);
      border-radius: 0.85vw;
      padding: 0.65vh 1vw;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .answer-box:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .answer-box.correct {
      background: var(--teal-soft);
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.16);
    }

    .answer-box.wrong {
      background: var(--red-soft);
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.14);
    }

    .answer-input {
      width: 4.2ch;
      min-width: 72px;
      background: transparent;
      border: none;
      border-bottom: 2.5px solid var(--border-strong);
      outline: none;
      text-align: center;
      font-family: inherit;
      font-weight: 900;
      font-size: clamp(1.35rem, 2.5vw, 2.75rem);
      line-height: 1.05;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      user-select: text;
      -webkit-user-select: text;
    }

    .answer-box:focus-within .answer-input {
      border-bottom-color: var(--blue);
    }

    .answer-box.correct .answer-input {
      color: var(--teal);
      border-bottom-color: var(--teal);
    }

    .answer-box.wrong .answer-input {
      color: var(--red);
      border-bottom-color: var(--red);
    }

    .answer-unit {
      font-weight: 800;
      font-size: clamp(1rem, 1.55vw, 1.7rem);
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .answer-box.correct .answer-unit {
      color: var(--teal);
    }

    .answer-check-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--teal);
      font-weight: 900;
      font-size: clamp(1.2rem, 2vw, 2.2rem);
      margin-left: 0.15vw;
    }

    .check-btn {
      border: none;
      background: var(--blue);
      color: #ffffff;
      font-family: inherit;
      font-weight: 900;
      font-size: clamp(0.95rem, 1.45vw, 1.55rem);
      padding: 1.15vh 1.5vw;
      border-radius: 0.85vw;
      cursor: pointer;
      box-shadow: 0 3px 0 #1d4ed8;
      transition: background 0.15s ease, transform 0.08s ease;
      white-space: nowrap;
    }

    .check-btn:hover {
      background: #1d4ed8;
    }

    .check-btn:active {
      transform: translateY(2px);
    }

    .stage-next-btn {
      border: none;
      background: var(--teal);
      color: #ffffff;
      font-family: inherit;
      font-weight: 900;
      font-size: clamp(0.95rem, 1.45vw, 1.55rem);
      padding: 1.15vh 1.5vw;
      border-radius: 0.85vw;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
      animation: nextPulse 1.6s ease-in-out infinite;
      white-space: nowrap;
    }

    .stage-next-btn:hover {
      background: #047857;
    }

    .chain-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    .chain {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(0.8vw * var(--chain-scale));
      max-width: 100%;
    }

    /* Fraction Node (Clean Whiteboard Ink Style) */
    .frac-node {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(1.4vh * var(--chain-scale)) calc(1.5vw * var(--chain-scale));
      border-radius: calc(1.2vw * var(--chain-scale));
      border: 2px solid transparent;
      background: transparent;
      animation: nodeEnter 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .frac-node.solved {
      background: var(--teal-soft);
      border-color: var(--teal-border);
    }

    @keyframes nodeEnter {
      from { opacity: 0; transform: translateX(14px) scale(0.94); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    .frac-row {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: calc(0.42vw * var(--chain-scale));
    }

    .frac-val {
      font-weight: 900;
      font-size: calc(clamp(2.4rem, 6.2vw, 7.2rem) * var(--chain-scale));
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .frac-unit {
      font-weight: 800;
      font-size: calc(clamp(1rem, 2.05vw, 2.3rem) * var(--chain-scale));
      color: var(--ink-muted);
    }

    .frac-node.solved .frac-val,
    .frac-node.solved .frac-unit {
      color: var(--teal);
    }

    .frac-bar {
      width: 100%;
      min-width: calc(9.5vw * var(--chain-scale));
      height: calc(clamp(4px, 0.58vh, 7px) * var(--chain-scale));
      background: var(--ink);
      border-radius: 999px;
      margin: calc(1.1vh * var(--chain-scale)) 0;
      transition: background 0.25s ease;
    }

    .frac-node.solved .frac-bar {
      background: var(--teal);
    }

    /* Inline Editable Starting Fraction (Explore Mode) */
    .editable-wrap {
      display: inline-flex;
      align-items: center;
      gap: calc(0.3vw * var(--chain-scale));
      border-radius: calc(0.8vw * var(--chain-scale));
      padding: 0 calc(0.3vw * var(--chain-scale));
      transition: background 0.15s ease;
    }

    .editable-wrap:hover,
    .editable-wrap:focus-within {
      background: var(--surface-subtle);
    }

    .nudge-btn {
      width: calc(clamp(22px, 2vw, 34px) * var(--chain-scale));
      height: calc(clamp(22px, 2vw, 34px) * var(--chain-scale));
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg);
      color: var(--ink);
      font-weight: 900;
      font-size: calc(clamp(0.9rem, 1.35vw, 1.45rem) * var(--chain-scale));
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .editable-wrap:hover .nudge-btn,
    .editable-wrap:focus-within .nudge-btn {
      opacity: 1;
    }

    .nudge-btn:hover {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: var(--blue);
    }

    .val-input {
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-family: inherit;
      font-weight: 900;
      font-size: calc(clamp(2.4rem, 6.2vw, 7.2rem) * var(--chain-scale));
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      border-radius: 0.5vw;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .frac-node.solved .val-input {
      color: var(--teal);
    }

    .val-input:focus {
      background: var(--bg);
      box-shadow: 0 0 0 2.5px var(--blue);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* Curved Top/Bottom Arrow Connector between Equivalent Fractions */
    .connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: calc(clamp(138px, 28vh, 275px) * var(--chain-scale));
      width: calc(clamp(62px, 7vw, 114px) * var(--chain-scale));
      animation: nodeEnter 0.22s ease forwards;
      flex-shrink: 0;
    }

    .arrow-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .op-pill {
      font-weight: 900;
      font-size: calc(clamp(0.95rem, 1.75vw, 1.95rem) * var(--chain-scale));
      padding: calc(0.28vh * var(--chain-scale)) calc(0.75vw * var(--chain-scale));
      border-radius: 999px;
      line-height: 1.15;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .op-pill.mul {
      background: var(--blue-soft);
      color: var(--blue);
      border: 1.5px solid var(--blue-border);
    }

    .op-pill.div {
      background: var(--teal-soft);
      color: var(--teal);
      border: 1.5px solid var(--teal-border);
    }

    .curved-arrow {
      width: 92%;
      height: calc(clamp(18px, 3.2vh, 34px) * var(--chain-scale));
      display: block;
      overflow: visible;
    }

    .eq-sign {
      font-weight: 900;
      font-size: calc(clamp(1.7rem, 3.6vw, 4rem) * var(--chain-scale));
      color: var(--ink-muted);
      line-height: 1;
    }

    /* Solved Speed Reveal (= 40 km/h) */
    .result-reveal {
      display: inline-flex;
      align-items: center;
      gap: calc(1vw * var(--chain-scale));
      animation: popReveal 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popReveal {
      from { opacity: 0; transform: scale(0.84) translateX(-10px); }
      to   { opacity: 1; transform: scale(1) translateX(0); }
    }

    .result-badge {
      display: inline-flex;
      align-items: baseline;
      gap: calc(0.45vw * var(--chain-scale));
      padding: calc(1.8vh * var(--chain-scale)) calc(1.8vw * var(--chain-scale));
      border-radius: calc(1.3vw * var(--chain-scale));
      background: var(--teal);
      color: #ffffff;
      box-shadow: 0 10px 28px rgba(5, 150, 105, 0.28);
      white-space: nowrap;
    }

    .result-val {
      font-weight: 900;
      font-size: calc(clamp(2.4rem, 6.2vw, 7.2rem) * var(--chain-scale));
      line-height: 1;
      letter-spacing: -0.025em;
      font-variant-numeric: tabular-nums;
    }

    .result-unit {
      font-weight: 800;
      font-size: calc(clamp(1.1rem, 2.2vw, 2.5rem) * var(--chain-scale));
      opacity: 0.92;
    }

       BAND 4: CHUNKY TV OPERATOR DOCK (~24vh, clean light-gray/white footer)
       ===================================================================== */
    .dock {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 1.4vh;
      padding: 1.6vh 2.5vw 2.1vh 2.5vw;
      background: var(--dock-bg);
      border-top: 1.5px solid var(--border);
    }

    .op-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr) 1.35fr;
      gap: 1vw;
      height: 100%;
    }

    .op-btn {
      border-radius: 1vw;
      font-family: inherit;
      font-weight: 900;
      font-size: clamp(1.2rem, 2.45vw, 2.65rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.12s ease;
      font-variant-numeric: tabular-nums;
      background: var(--bg);
    }

    .op-btn:active {
      transform: translateY(2px) scale(0.98);
    }

    /* Row 1: Multiply (Royal Blue Accent) */
    .op-btn.mul {
      color: var(--blue);
      border: 2px solid var(--blue-border);
      box-shadow: 0 3px 0 #dbeafe;
    }

    .op-btn.mul:hover {
      background: var(--blue-soft);
      border-color: var(--blue);
    }

    /* Row 2: Divide (Teal/Emerald Accent) */
    .op-btn.div {
      color: var(--teal);
      border: 2px solid var(--teal-border);
      box-shadow: 0 3px 0 #d1fae5;
    }

    .op-btn.div:hover {
      background: var(--teal-soft);
      border-color: var(--teal);
    }

    /* Custom × [ ] and ÷ [ ] Input Buttons */
    .custom-op {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45vw;
      border-radius: 1vw;
      padding: 0 0.8vw;
      font-weight: 900;
      font-size: clamp(1.2rem, 2.3vw, 2.4rem);
      background: var(--bg);
    }

    .custom-op.mul {
      color: var(--blue);
      border: 2px solid var(--blue-border);
      box-shadow: 0 3px 0 #dbeafe;
    }

    .custom-op.div {
      color: var(--teal);
      border: 2px solid var(--teal-border);
      box-shadow: 0 3px 0 #d1fae5;
    }

    .custom-op input {
      width: 100%;
      min-width: 0;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 0.55vw;
      color: var(--ink);
      font-family: inherit;

      padding: 0.55vh 0.25vw;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .custom-op.mul input:focus {
      background: var(--bg);
      border-color: var(--blue);
    }

    .custom-op.div input:focus {
      background: var(--bg);
      border-color: var(--teal);
    }

    .custom-go {
      border: none;
      border-radius: 0.55vw;
      padding: 0.65vh 0.75vw;
      font-weight: 900;
      font-size: clamp(0.95rem, 1.45vw, 1.55rem);
      cursor: pointer;
      flex-shrink: 0;
      color: #ffffff;
    }

    .custom-op.mul .custom-go { background: var(--blue); }
    .custom-op.div .custom-go { background: var(--teal); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }

    .shake {
      animation: shake 0.32s ease;
    }

      mode: 'explore',        // 'explore' | 'game'
      tier: 1,                // 1 | 2 | 3
      score: 0,
      total: 0,
      lastProblemIdx: -1,
      currentProblem: null,
      solvedCurrent: false,
      vehicleId: 'car',
      steps: [{ km: 20, min: 30, op: null, factor: null }]
    };

    // Vehicle animation state (managed by requestAnimationFrame)
    const anim = {
      x: 40,
      lastTs: 0,
      boostUntil: 0,
      wasSolved: false
    };

    /* =====================================================================
       MATH & FORMATTING HELPERS
       ===================================================================== */
    function fmt(n) {
      if (!isFinite(n)) return '0';
      const rounded = Math.round(n * 100) / 100;
      if (Math.abs(rounded - Math.round(rounded)) < 1e-9) {
        return String(Math.round(rounded));
      }
      return String(parseFloat(rounded.toFixed(2)));
    }

    function isSixty(m) {
      return Math.abs(m - 60) < 0.005;
    }

    // Allows integers & clean terminating decimals up to 2 decimal places (e.g. 2.5, 3.75)
    function isCleanDecimal(val) {
      if (!isFinite(val) || val <= 0) return false;
      return Math.abs(val * 100 - Math.round(val * 100)) < 1e-6;
    }

    function currentKmh() {
      const s = state.steps[0];
      if (!s || s.min <= 0) return 40;
      return (s.km / s.min) * 60;
    }

    function shakeEl(el) {
      if (!el) return;
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
    }

    /* =====================================================================
       VEHICLE PICKER & SMOOTH ANIMATION LOOP
       ===================================================================== */
    function initVehiclePicker() {
      const picker = document.getElementById('vehicle-picker');
      picker.innerHTML = VEHICLES.map(v => `
        <button class="veh-btn ${v.id === state.vehicleId ? 'active' : ''}"
                id="veh-btn-${v.id}"
                title="${v.title}"
                onclick="selectVehicle('${v.id}')">
          ${v.icon}
        </button>
      `).join('');
      renderVehicleSvg();
    }

    function selectVehicle(id) {
      state.vehicleId = id;
      VEHICLES.forEach(v => {
        const btn = document.getElementById(`veh-btn-${v.id}`);
        if (btn) btn.classList.toggle('active', v.id === id);
      });
      renderVehicleSvg();
    }

    function renderVehicleSvg() {
      const v = VEHICLES.find(item => item.id === state.vehicleId) || VEHICLES[1];
      document.getElementById('vehicle-svg-wrap').innerHTML = v.trackSvg;
    }

    function triggerSpeedBoost() {
      anim.boostUntil = performance.now() + 1500;
    }

    function startVehicleLoop() {
      const roadEl = document.getElementById('road-stage');
      const runnerEl = document.getElementById('vehicle-runner');
      const linesEl = document.getElementById('speed-lines');

      function tick(ts) {
        if (!anim.lastTs) anim.lastTs = ts;
        const dt = Math.min(0.05, (ts - anim.lastTs) / 1000);
        anim.lastTs = ts;

        const kmh = currentKmh();
        const isBoosting = ts < anim.boostUntil;

        // Scale pixels/sec smoothly with actual km/h
        // 10 km/h -> ~68 px/s | 40 km/h -> ~195 px/s | 120 km/h -> ~490 px/s | 250+ -> ~800 px/s
        let pxPerSec = Math.min(820, Math.max(42, 32 + Math.pow(kmh, 0.88) * 6.4));
        if (isBoosting) pxPerSec *= 2.15;

        // Update wheel spin speed dynamically
        const wheelDur = Math.max(0.12, Math.min(1.8, 120 / pxPerSec));
        runnerEl.style.setProperty('--wheel-dur', `${wheelDur.toFixed(2)}s`);
        linesEl.classList.toggle('boost', isBoosting);

        const roadW = roadEl.clientWidth || window.innerWidth;
        const runnerW = runnerEl.offsetWidth || 130;

        anim.x += pxPerSec * dt;
        if (anim.x > roadW + 30) {
          anim.x = -runnerW - 20;
        }

        runnerEl.style.transform = `translate3d(${anim.x.toFixed(1)}px, 0, 0)`;
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    /* =====================================================================
       MODE, DIFFICULTY & GAME FLOW
       ===================================================================== */
    function updateScoreDisplay() {
      document.getElementById('score-val').textContent = `${state.score} / ${state.total}`;
    }

    function setMode(mode) {
      if (state.mode === mode) return;
      state.mode = mode;

      const btnEx = document.getElementById('btn-mode-explore');
      const btnGm = document.getElementById('btn-mode-game');
      const gameCtrl = document.getElementById('game-controls');
      const promptBar = document.getElementById('game-prompt-bar');

      if (mode === 'explore') {
        btnEx.className = 'mode-btn active';
        btnGm.className = 'mode-btn';
        gameCtrl.classList.add('hidden');
        promptBar.classList.add('hidden');
        state.solvedCurrent = false;
        state.currentProblem = null;
        anim.wasSolved = false;
        state.steps = [{ km: 20, min: 30, op: null, factor: null }];
        render();
      } else {
        btnEx.className = 'mode-btn';
        btnGm.className = 'mode-btn active game-on';
        gameCtrl.classList.remove('hidden');
        promptBar.classList.remove('hidden');
        updateScoreDisplay();
        nextProblem(true);
      }
    }

    function setTier(t) {
      state.tier = t;
      state.lastProblemIdx = -1;
      [1, 2, 3].forEach(i => {
        document.getElementById(`tier-${i}`).classList.toggle('active', i === t);
      });
      nextProblem(true);
    }

    function nextProblem(force = false) {
      if (!force && !state.solvedCurrent) return;
      const bank = PROBLEMS[state.tier];
      let idx = Math.floor(Math.random() * bank.length);
      if (idx === state.lastProblemIdx && bank.length > 1) {
        idx = (idx + 1) % bank.length;
      }
      state.lastProblemIdx = idx;
      const prob = bank[idx];
      state.currentProblem = prob;
      state.steps = [{ km: prob.km, min: prob.min, op: null, factor: null }];
      state.solvedCurrent = false;
      anim.wasSolved = false;

      // Auto-select matching vehicle for the word problem
      selectVehicle(prob.vehicle);

      // Update word problem prompt & reset answer input UI
      document.getElementById('problem-text').textContent = prob.text;
      const ansInput = document.getElementById('answer-input');
      const ansBox = document.getElementById('answer-box');
      const checkMark = document.getElementById('answer-check-mark');
      const btnCheck = document.getElementById('btn-check');
      const btnNext = document.getElementById('btn-next');

      ansInput.value = '';
      ansInput.disabled = false;
      ansBox.className = 'answer-box';
      checkMark.classList.add('hidden');
      btnCheck.classList.remove('hidden');
      btnNext.classList.add('hidden');

      render();
    }

    function handleAnswerKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (state.solvedCurrent) {
          nextProblem();
        } else {
          checkAnswer();
        }
      } else {
        // Clear wrong-state red border as soon as user edits their answer
        document.getElementById('answer-box').classList.remove('wrong');
      }
    }

    function checkAnswer() {
      if (state.mode !== 'game' || state.solvedCurrent || !state.currentProblem) return;

      const ansInput = document.getElementById('answer-input');
      const ansBox = document.getElementById('answer-box');
      const raw = parseFloat(ansInput.value);

      if (isNaN(raw)) {
        ansBox.classList.add('wrong');
        shakeEl(ansBox);
        ansInput.focus();
        return;
      }

      const expected = (state.currentProblem.km / state.currentProblem.min) * 60;
      const isCorrect = Math.abs(raw - expected) < 0.01;

      if (isCorrect) {
        state.solvedCurrent = true;
        state.score++;
        state.total++;
        updateScoreDisplay();

        ansInput.value = fmt(expected);
        ansInput.disabled = true;
        ansInput.blur();
        ansBox.classList.remove('wrong');
        ansBox.classList.add('correct');
        document.getElementById('answer-check-mark').classList.remove('hidden');
        document.getElementById('btn-check').classList.add('hidden');
        document.getElementById('btn-next').classList.remove('hidden');

        triggerSpeedBoost();
      } else {
        ansBox.classList.add('wrong');
        shakeEl(ansBox);
        ansInput.focus();
        ansInput.select();
      }
    }

    /* =====================================================================
       FRACTION OPERATIONS
       ===================================================================== */
    function updateStartValue(field, rawVal) {
      if (state.mode !== 'explore') return;
      const val = parseFloat(rawVal);
      if (isNaN(val) || val <= 0) {
        render();
        return;
      }
      const base = { ...state.steps[0] };
      base[field] = Math.round(val * 100) / 100;
      state.steps = [base];
      anim.wasSolved = isSixty(base.min);
      render();
    }

    function nudgeStart(field, delta) {
      if (state.mode !== 'explore') return;
      const base = { ...state.steps[0] };
      base[field] = Math.max(1, Math.round((base[field] + delta) * 100) / 100);
      state.steps = [base];
      anim.wasSolved = isSixty(base.min);
      render();
    }

    function applyOp(type, factor, sourceEl) {
      if (!isFinite(factor) || factor <= 0) {
        shakeEl(sourceEl);
        return;
      }

      // Cap chain at 5 fractions (1 start + 4 steps) for crisp TV readability
      if (state.steps.length >= 5) {
        shakeEl(document.getElementById('chain'));
        return;
      }

      const cur = state.steps[state.steps.length - 1];
      const nextKm = type === 'mul' ? cur.km * factor : cur.km / factor;
      const nextMin = type === 'mul' ? cur.min * factor : cur.min / factor;

      // Division check: reject repeating/ugly decimals (> 2 decimal places) with subtle shake
      if (type === 'div' && (!isCleanDecimal(nextKm) || !isCleanDecimal(nextMin))) {
        shakeEl(sourceEl);
        return;
      }

      if (nextKm > 999999 || nextMin > 999999 || nextMin < 0.01) {
        shakeEl(sourceEl);
        return;
      }

      state.steps.push({
        km: Math.round(nextKm * 100) / 100,
        min: Math.round(nextMin * 100) / 100,
        op: type,
        factor
      });

      const nowSolved = isSixty(nextMin);
      if (state.mode === 'explore' && nowSolved && !anim.wasSolved) {
        triggerSpeedBoost();
      }
      anim.wasSolved = nowSolved;

      render();
    }

    function applyCustomOp(type) {
      const input = document.getElementById(type === 'mul' ? 'custom-mul' : 'custom-div');
      const wrap = document.getElementById(type === 'mul' ? 'custom-mul-wrap' : 'custom-div-wrap');
      const val = parseFloat(input.value);
      if (isNaN(val) || val <= 0) {
        shakeEl(wrap);
        return;
      }
      input.value = '';
      input.blur();
      applyOp(type, val, wrap);
    }

    function undoStep() {
      if (state.steps.length <= 1) return;
      state.steps.pop();
      const latest = state.steps[state.steps.length - 1];
      anim.wasSolved = isSixty(latest.min);
      render();
    }

    function resetChain() {
      if (state.steps.length > 1) {
        state.steps = [state.steps[0]];
      } else if (state.mode === 'explore') {
        state.steps = [{ km: 20, min: 30, op: null, factor: null }];
      }
      anim.wasSolved = isSixty(state.steps[0].min);
      render();
    }

    /* =====================================================================
       RENDER ENGINE (FRACTION CHAIN + CURVED ARROWS + PROGRESS BAR)
       ===================================================================== */
    function render() {
      const steps = state.steps;
      const latest = steps[steps.length - 1];
      const at60 = isSixty(latest.min);
      const showResultBadge = state.mode === 'explore' && at60;

      // 1. Dynamic chain scale so 1–5 fractions + solved result always fit 100vw cleanly
      const baseScale = { 1: 1.02, 2: 0.86, 3: 0.67, 4: 0.54, 5: 0.45 }[steps.length] || 0.45;
      let scale = state.mode === 'game' ? baseScale * 0.84 : baseScale;
      if (showResultBadge) scale *= 0.92;
      document.documentElement.style.setProperty('--chain-scale', scale.toFixed(3));

      // 2. Topbar Undo button state
      document.getElementById('btn-undo').disabled = steps.length <= 1;

      // 3. Build Equivalent Fraction Chain with Curved Top/Bottom Arrows
      let html = '';
      steps.forEach((step, i) => {
        const nodeAt60 = isSixty(step.min);

        if (i > 0) {
          const sym = step.op === 'mul' ? '×' : '÷';
          const badge = `${sym}${fmt(step.factor)}`;
          const strokeColor = step.op === 'mul' ? '#2563eb' : '#059669';

          html += `
            <div class="connector">
              <div class="arrow-block">
                <span class="op-pill ${step.op}">${badge}</span>
                <svg class="curved-arrow" viewBox="0 0 90 28" fill="none">
                  <path d="M8 24 Q45 3 80 21" stroke="${strokeColor}" stroke-width="3.2" stroke-linecap="round"/>
                  <path d="M72 12 L82 22 L69 24" stroke="${strokeColor}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <span class="eq-sign">=</span>
              <div class="arrow-block">
                <svg class="curved-arrow" viewBox="0 0 90 28" fill="none">
                  <path d="M8 4 Q45 25 80 7" stroke="${strokeColor}" stroke-width="3.2" stroke-linecap="round"/>
                  <path d="M69 4 L82 6 L72 16" stroke="${strokeColor}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="op-pill ${step.op}">${badge}</span>
              </div>
            </div>
          `;
        }

        const canEdit = state.mode === 'explore' && i === 0;
        const kmStr = fmt(step.km);
        const minStr = fmt(step.min);
        const kmW = Math.max(2, kmStr.length + 0.45);
        const minW = Math.max(2, minStr.length + 0.45);

        const topRow = canEdit
          ? `<div class="editable-wrap">
               <button class="nudge-btn" onclick="nudgeStart('km', -5)" tabindex="-1">−</button>
               <input class="val-input" style="width:${kmW}ch" type="number" step="any" min="0.01"
                 value="${kmStr}"
                 onchange="updateStartValue('km', this.value)"
                 onkeydown="if(event.key==='Enter') this.blur()" />
               <span class="frac-unit">km</span>
               <button class="nudge-btn" onclick="nudgeStart('km', 5)" tabindex="-1">+</button>
             </div>`
          : `<div class="frac-row">
               <span class="frac-val">${kmStr}</span>
               <span class="frac-unit">km</span>
             </div>`;

        const botRow = canEdit
          ? `<div class="editable-wrap">
               <button class="nudge-btn" onclick="nudgeStart('min', -5)" tabindex="-1">−</button>
               <input class="val-input" style="width:${minW}ch" type="number" step="any" min="0.01"
                 value="${minStr}"
                 onchange="updateStartValue('min', this.value)"
                 onkeydown="if(event.key==='Enter') this.blur()" />
               <span class="frac-unit">min</span>
               <button class="nudge-btn" onclick="nudgeStart('min', 5)" tabindex="-1">+</button>
             </div>`
          : `<div class="frac-row">
               <span class="frac-val">${minStr}</span>
               <span class="frac-unit">min</span>
             </div>`;

        html += `
          <div class="frac-node ${nodeAt60 ? 'solved' : ''}">
            ${topRow}
            <div class="frac-bar"></div>
            ${botRow}
          </div>
        `;
      });

      // In Explore mode, smoothly reveal "= 40 km/h" once denominator hits 60 min
      // (In Game mode, the 60 min fraction highlights in emerald so students enter it in the ___ km/h box)
      if (showResultBadge) {
        html += `
          <div class="result-reveal">
            <span class="eq-sign" style="color: var(--teal)">=</span>
            <div class="result-badge">
              <span class="result-val">${fmt(latest.km)}</span>
              <span class="result-unit">km/h</span>
            </div>
          </div>
        `;
      }

      document.getElementById('chain').innerHTML = html;

      // 4. Update 60-min Progress Bar
      renderProgressBar(latest.min, at60);
    }

    function renderProgressBar(curMin, at60) {
      const maxScale = Math.max(100, curMin * 1.12);
      const fillPct = Math.min(100, Math.max(1.5, (curMin / maxScale) * 100));
      const goalPct = (60 / maxScale) * 100;

      const fillEl = document.getElementById('progress-fill');
      const goalEl = document.getElementById('goal-line');
      const tag60 = document.getElementById('tag-60');
      const tagCur = document.getElementById('tag-cur');

      fillEl.style.width = `${fillPct.toFixed(2)}%`;
      fillEl.classList.toggle('solved', at60);

      goalEl.style.left = `${goalPct.toFixed(2)}%`;
      tag60.style.left = `${goalPct.toFixed(2)}%`;

      const overlaps = Math.abs(fillPct - goalPct) < 7;
      tagCur.textContent = `${fmt(curMin)} min`;
      tagCur.style.left = `${Math.min(96, Math.max(4, fillPct)).toFixed(2)}%`;
      tagCur.style.opacity = overlaps ? '0' : '1';
    }

    /* =====================================================================
       KEYBOARD SHORTCUTS (Backspace = Undo, R = Reset, Space/Enter = Next)
       ===================================================================== */
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (e.key === 'Backspace') {
        e.preventDefault();
        undoStep();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        resetChain();
      } else if ((e.key === ' ' || e.key === 'Enter') && state.mode === 'game' && state.solvedCurrent) {
        e.preventDefault();
        nextProblem();
      }
    });

    // Boot
    initVehiclePicker();
    render();
    startVehicleLoop();
  </script>
</body>
</html>
